; Linux dedicated server export preset for Edgegap. Append to the project's
; export_presets.cfg and renumber [preset.N] / [preset.N.options] to the next
; free index (N must be unique). Export from the command line:
;   godot --headless --path . --export-release "Edgegap Linux Server" build/server/server.x86_64
; Needs the Linux export templates for the exact Godot version
; (Editor → Manage Export Templates, or the .tpz from the Godot release page).
;
; dedicated_server=true is Export Mode "Dedicated Server": it adds the
; dedicated_server feature tag (EdgegapServer.is_server_launch(), and project
; settings overridden with .dedicated_server) and strips textures, audio and
; meshes to placeholders, which a headless server doesn't need.
; export_filter="all_resources" exports every file. If the game uses an
; explicit allowlist, the new scripts (res://edgegap/*.gd) must be exported
; too, or the export fails only at runtime. With "resources", add them to
; export_files. With "scenes", export_files only takes scenes: switch that
; preset to "resources" (scenes + scripts listed) or "all_resources".

[preset.9]

name="Edgegap Linux Server"
platform="Linux"
runnable=false
dedicated_server=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/server/server.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.9.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
