name: spec drift

# Weekly: compare the published Edgegap OpenAPI specs with the commit pinned in
# scripts/spec-pin.txt. On drift, open (or comment
# on) one tracking issue so the skills' API facts get reviewed.
on:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: spec-drift
  cancel-in-progress: false

env:
  ISSUE_TITLE: "Edgegap OpenAPI spec changed: review the skills"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare with published spec
        id: check
        run: |
          set +e
          python scripts/check_spec.py > report.txt 2>&1
          code=$?
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```diff'
            head -c 60000 report.txt
            echo '```'
            echo
            echo 'To resolve: re-read the changed operations, then `python scripts/check_spec.py --update`;'
            echo 'fix skills/edgegap-deployments-api/references/api-reference.md and any affected skill,'
            echo 'bump their metadata.version, and add a CHANGELOG entry.'
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$([ $code -ne 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Open or update the tracking issue
        if: steps.check.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${ISSUE_TITLE}\" in:title" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file report.md
          fi
      - name: Fail on drift
        if: steps.check.outputs.failed == '1'
        run: exit 1
